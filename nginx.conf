server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS Resolver necessário para proxy_pass com SSL e nomes de domínio
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=300s ipv6=off;

    # Cabeçalhos CORS globais
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
    add_header Access-Control-Allow-Headers '*' always;

    # Gzip para carregar scripts e JSONs rapidamente
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Página inicial
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Favicon e SpeedTest
    location = /favicon.ico {
        try_files /favicon-a68924fc18.ico /favicon.ico =204;
    }
    location ~* (NetSpeedTest|imgNetSpeedTest) {
        try_files /netSpeedTest-ca84938e6a.png =404;
    }

    # Versionamento
    location ~* version\.json$ {
        try_files /version.json =404;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache";
    }

    # Roteamento de rotas de order e clientlog para o backend wartune-server
    location ~* /(order/)?clientsiteinfoservlet$ {
        proxy_pass https://bots-wartune.thnsdu.easypanel.host;
        proxy_set_header Host bots-wartune.thnsdu.easypanel.host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /clientlog {
        proxy_pass https://bots-wartune.thnsdu.easypanel.host/clientlog;
        proxy_set_header Host bots-wartune.thnsdu.easypanel.host;
        proxy_ssl_server_name on;
    }

    location /api/player/ {
        proxy_pass https://bots-wartune.thnsdu.easypanel.host;
        proxy_set_header Host bots-wartune.thnsdu.easypanel.host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoints HTTP da API do jogo que o cliente H5 requisita usando REQUEST_PATH (URL do frontend)
    location ~ ^/+(nicknamecheck|questionreplaylist|maillist|updateplayernovice|visualizeregister|login|login2|loginselectlist|flashversionservlet|complaintshandle|appraisereplayservlet|activecheck|images/.*)$ {
        rewrite ^/+(.*)$ /$1 break;
        proxy_pass https://bots-wartune.thnsdu.easypanel.host;
        proxy_set_header Host bots-wartune.thnsdu.easypanel.host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket direto para o backend se o cliente conectar na mesma porta
    location /ws {
        proxy_pass https://bots-wartune.thnsdu.easypanel.host/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host bots-wartune.thnsdu.easypanel.host;
        proxy_ssl_server_name on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Assets em /res/ com fallback automático para a CDN upstream oficial
    location /res/ {
        try_files $uri @cdn_res;
    }

    location @cdn_res {
        proxy_pass https://sqh5bmdim-cdn.funshinegames.com/7road$request_uri;
        proxy_set_header Host sqh5bmdim-cdn.funshinegames.com;
        proxy_ssl_server_name on;
        proxy_ssl_name sqh5bmdim-cdn.funshinegames.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_buffering on;
        add_header Access-Control-Allow-Origin * always;
        expires 30d;
    }

    # Arquivos estáticos locais (js, libs, minisdk, etc.)
    location / {
        try_files $uri $uri/ =404;
        add_header Access-Control-Allow-Origin * always;
    }
}

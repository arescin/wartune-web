<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wartune Ultra (local)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="renderer" content="webkit">
  <style>html,body{margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%}</style>
</head>
<body>
<script>
  // Forward page errors to the local server (server/logs/client.log) for diagnosis.
  (function () {
    function post(kind, msg) { try { fetch('/clientlog', { method: 'POST', body: JSON.stringify({ kind: kind, msg: String(msg).slice(0, 4000), t: Date.now(), ua: navigator.userAgent }), keepalive: true }).catch(function () {}); } catch (e) {} }
    window.addEventListener('error', function (e) { post('error', (e.message || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + (e.error && e.error.stack ? ' | ' + e.error.stack : '')); });
    window.addEventListener('unhandledrejection', function (e) { post('rejection', e.reason && (e.reason.stack || e.reason)); });
    // the game's own console output (first 600 lines per page load) and page unloads (self-reloads)
    var n = 0;
    ['log', 'info', 'warn', 'error'].forEach(function (lv) {
      var orig = console[lv];
      console[lv] = function () {
        if (n++ < 600) { try { post('console.' + lv, Array.prototype.map.call(arguments, function (a) { try { return typeof a === 'string' ? a : (a && a.stack) || JSON.stringify(a); } catch (e) { return String(a); } }).join(' ')); } catch (e) {} }
        return orig.apply(console, arguments);
      };
    });
    window.addEventListener('beforeunload', function () { post('unload', 'page unloading after ' + n + ' console lines'); });
    post('boot', location.href + ' webgl=' + !!document.createElement('canvas').getContext('webgl') + ' ls=' + (function () { try { var o = {}; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); o[k] = String(localStorage.getItem(k)).slice(0, 120); } return JSON.stringify(o); } catch (e) { return 'n/a'; } })());
  })();
</script>
<script>
  // Web equivalent of LayaNative's loadLib: ordered, synchronous-execution script tags.
  // The game also calls loadLib(url, callback) (e.g. libs/h5sdk/yim.*) and waits for the callback, so it
  // must fire on load and on error (a missing optional lib must not stall the boot).
  function loadLib(url, cb) {
    var s = document.createElement("script");
    s.async = false;
    s.src = url;
    if (typeof cb === "function") {
      var done = false;
      var fire = function () { if (!done) { done = true; cb(); } };
      s.onload = fire;
      s.onerror = function () { try { fetch('/clientlog', { method: 'POST', body: JSON.stringify({ kind: 'error', msg: 'loadLib failed: ' + url }) }); } catch (e) {} fire(); };
    }
    document.body.appendChild(s);
  }
</script>
<script src="js/auth-overlay.js"></script>
<script src="index.js"></script>
</body>
</html>
